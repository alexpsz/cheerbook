name: 自动合并

on:
  workflow_run:
    workflows: [检查]
    types: [completed]

permissions: {}

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.path == '.github/workflows/check.yml'
    runs-on: ubuntu-latest
    concurrency:
      group: cheerbook-main-writers
      queue: max
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      statuses: read
    env:
      CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: 取出默认分支
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: 列出打开的 Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" > "$RUNNER_TEMP/open.json"
      - name: 找到检查对应的 Pull Request
        id: find
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const path = require('node:path');
          const { pullRequestForHead } = require(path.resolve('lib/contributors.js'));
          const pages = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'open.json'), 'utf8'));
          // The check's run, read as data: the pull request must come from the repository and branch it ran for.
          const { workflow_run: run } = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const found = pullRequestForHead(pages.flat(), process.env.CHECKED_SHA, process.env.DEFAULT_BRANCH, run || null);
          console.log(found.reason);
          if (found.number) fs.appendFileSync(process.env.GITHUB_OUTPUT, `number=${found.number}\n`);
      - name: 读取 Pull Request 与检查过的提交修改的文件
        if: steps.find.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.find.outputs.number }}
        run: |
          if [[ ! "$NUMBER" =~ ^[1-9][0-9]*$ || ! "$CHECKED_SHA" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]]; then
            echo "Pull Request 编号或提交编号的格式不对。"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" > "$RUNNER_TEMP/pull.json"
          BASE=$(git rev-parse HEAD)
          gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$CHECKED_SHA" > "$RUNNER_TEMP/compare.json"
          git rev-parse HEAD > "$RUNNER_TEMP/base.txt"
      - name: 判断能否自动合并
        id: decide
        if: steps.find.outputs.number != ''
        env:
          NUMBER: ${{ steps.find.outputs.number }}
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const path = require('node:path');
          const { quote, autoMergeDecision } = require(path.resolve('lib/contributors.js'));
          const read = name => JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, name), 'utf8'));
          const number = Number(process.env.NUMBER);
          let decision;
          try {
            const pull = read('pull.json');
            const compare = read('compare.json');
            if (pull.number !== number || pull.state !== 'open' || !pull.base || pull.base.ref !== process.env.DEFAULT_BRANCH) {
              decision = { merge: false, reason: 'Pull Request 已关闭，或不是合并到默认分支，不自动合并。' };
            } else {
              decision = autoMergeDecision({
                baseSha: pull.base.sha,
                expectedBase: fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'base.txt'), 'utf8').trim(),
                files: compare.files,
                draft: pull.draft,
                headSha: pull.head && pull.head.sha,
                checkedSha: process.env.CHECKED_SHA,
                changedFiles: pull.changed_files,
              });
            }
          } catch (error) {
            decision = { merge: false, reason: `无法判断（${quote(error.message)}），不自动合并。` };
          }
          console.log(`Pull Request #${number}：${decision.reason}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `merge=${decision.merge === true}\n`);
      - name: 核对待合并的实际内容
        if: steps.decide.outputs.merge == 'true'
        env:
          NUMBER: ${{ steps.find.outputs.number }}
        run: |
          [[ "$NUMBER" =~ ^[1-9][0-9]*$ ]]
          git fetch --no-tags origin "refs/pull/$NUMBER/merge"
          node tools/check-merge-tree.js "$CHECKED_SHA" "$RUNNER_TEMP/compare.json" "$RUNNER_TEMP/validated"
          node tools/check.js "$RUNNER_TEMP/validated"
      - name: 合并
        if: steps.decide.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.find.outputs.number }}
        run: |
          if [[ ! "$NUMBER" =~ ^[1-9][0-9]*$ || ! "$CHECKED_SHA" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]]; then
            echo "Pull Request 编号或提交编号的格式不对。"
            exit 1
          fi
          # Checks and conditional reviews start independently; the merge API will refuse a
          # required status that has not appeared yet. Wait only for this exact SHA and context.
          for attempt in {1..24}; do
            review=$(gh api "repos/$GITHUB_REPOSITORY/commits/$CHECKED_SHA/statuses?per_page=100" --jq '[.[] | select(.context == "cheerbook/review-policy" and .creator.login == "github-actions[bot]")][0].state // "pending"')
            [[ "$review" == success ]] && break
            if [[ "$review" != pending || "$attempt" == 24 ]]; then
              echo "审核状态尚未通过。请先核对“投稿审核”，通过后重新运行本次“自动合并”。"
              exit 1
            fi
            sleep 5
          done
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)" != "$(git rev-parse HEAD)" ]]; then
            echo "默认分支已更新，请在新基准上重新检查此投稿。"
            exit 1
          fi
          gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/merge" -f merge_method=squash -f sha="$CHECKED_SHA" --jq .message
          # Nothing is written back to main after the merge: the website builds its own index.json
          # from the merged files, and Cloudflare Pages rebuilds on this push.
          echo "已合并 Pull Request #$NUMBER。网站会在 Cloudflare Pages 重建后列出新文件。"
