# After a merge to main, regenerates index.json from cheers/ and commits it when it changed, so
# contributors never have to run the index tool themselves. The checkout keeps no token; the token
# is handed only to the final push, after the index tool has run.
name: 更新索引

on:
  push:
    branches: [main]
    paths:
      - 'cheers/**'
      - 'lib/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: 生成 index.json
        run: node tools/build-index.js
      - name: 提交变化
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- index.json; then
            echo "index.json 没有变化。"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.json
          git commit -m 'index: regenerate index.json'
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
